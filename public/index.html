<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Request Management</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Login screen -->
  <div id="login-screen" class="login-screen hidden">
    <form id="login-form" class="login-card">
      <h1>Request Management</h1>
      <p class="muted">Sign in to your account</p>
      <label>Username
        <input type="text" id="login-input" autocomplete="username" required>
      </label>
      <label>Password
        <div class="pw-wrap">
          <input type="password" id="password-input" autocomplete="current-password">
          <button type="button" class="pw-toggle" onclick="togglePw(this)">Show</button>
        </div>
      </label>
      <div id="login-error" class="form-error hidden"></div>
      <button type="submit" class="btn btn-primary btn-block">Sign in</button>
      <p class="muted small" style="margin:14px 0 0; text-align:center">Signing in for the first time? Leave the password blank.</p>
    </form>
  </div>

  <!-- First-time password setup (shown when the account has no password yet) -->
  <div id="setpw-screen" class="login-screen hidden">
    <form id="setpw-form" class="login-card">
      <h1>Set your password</h1>
      <p class="muted">Welcome, <span id="setpw-name"></span>. Please choose a password to finish setting up your account.</p>
      <label>New password
        <div class="pw-wrap">
          <input type="password" id="setpw-new" autocomplete="new-password" required minlength="6">
          <button type="button" class="pw-toggle" onclick="togglePw(this)">Show</button>
        </div>
      </label>
      <label>Confirm password
        <div class="pw-wrap">
          <input type="password" id="setpw-confirm" autocomplete="new-password" required minlength="6">
          <button type="button" class="pw-toggle" onclick="togglePw(this)">Show</button>
        </div>
      </label>
      <div id="setpw-error" class="form-error hidden"></div>
      <button type="submit" class="btn btn-primary btn-block">Save and continue</button>
      <button type="button" id="setpw-cancel" class="btn btn-ghost btn-block" style="margin-top:10px">Cancel — sign in as a different user</button>
    </form>
  </div>

  <!-- Main interface -->
  <div id="app" class="hidden">
    <header class="topbar">
      <div class="topbar-brand">Request Management</div>
      <nav id="nav-tabs" class="topbar-nav"></nav>
      <div class="topbar-user">
        <div class="user-info">
          <span id="user-name"></span>
          <span id="user-role" class="muted small"></span>
        </div>
        <button id="btn-change-password" class="btn btn-ghost" title="Change password">Password</button>
        <button id="btn-logout" class="btn btn-ghost">Sign out</button>
      </div>
    </header>
    <main id="main" class="main"></main>
  </div>

  <!-- Modal -->
  <div id="modal-backdrop" class="modal-backdrop hidden">
    <div id="modal" class="modal"></div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="app.js"></script>
</body>
</html>
